project:
  type: website
  output-dir: _site
  resources:
    - figs/**
    - assets/data/**
    - robots.txt
  render:
    - "*.qmd"
    - "about/**/*.qmd"
    - "research/**/*.qmd"
    - "archive/**/*.qmd"
    - "background/**/*.qmd"
    - "goalies/**/*.qmd"
    - "tennis/**/*.qmd"
    - "projects/**/*.qmd"
    - "draft/**/*.qmd"
    - "post-regulation/**/*.qmd"
    - "20*/**/*.qmd"
    - "posts/**/*.qmd"
    - "!templates/**/*.qmd"

website:
  title: "jeremie.spagnolo"
  site-url: "https://spazznolo.github.io"
  description: "Sports statistics, applied modeling, and research notes by Jeremie Spagnolo."
  google-analytics: "G-DGRHZS5DNM"
  open-graph: true
  search: false
  navbar:
    collapse: true
    right:
      - text: "Home"
        href: /
      - text: "Research"
        href: /research/
      - text: "About"
        href: /about/
  page-footer:
    border: false

format:
  html:
    canonical-url: true
    theme:
      dark: [cosmo, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    css: styles/site.css
    respect-user-color-scheme: false
    toc: true
    toc-location: body
    title-block-categories: false
    code-fold: true
    code-summary: "Show code"
    syntax-highlighting: arrow
    fig-cap-location: bottom
    link-external-newwindow: true

execute:
  freeze: auto

filters:
  - filters/reading-time.lua
  - filters/historical-code.lua
